[package]
name = "es-replay-persistence"
version.workspace = true
edition.workspace = true
description = "Persistence layer for the Replay event sourcing library (PostgreSQL and in-memory backends)"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["event-sourcing", "cqrs", "postgres", "sqlx", "persistence"]
categories = ["database", "asynchronous"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[lib]
crate-type = ["lib"]
name = "replay_persistence"

[dependencies]
replay = { package = "es-replay", path = "../es", version = "0.10.0" }
replay-macros = { package = "es-replay-macros", path = "../macros", version = "0.10.0" }

serde = { workspace = true }
serde_with = { workspace = true }
serde_json = { workspace = true }

urn = { workspace = true }
uuid = { workspace = true }

chrono = { workspace = true }

thiserror = { workspace = true }
anyhow = { workspace = true }

sqlx = { workspace = true }

tokio = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }

tracing = { workspace = true }
moka = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
# `no-env-filter` so a test binary captures the *library's* records: the default
# filter is scoped to the crate the test lives in, which is never this one.
tracing-test = { workspace = true, features = ["no-env-filter"] }
tokio-test = { workspace = true }
testcontainers-modules = { workspace = true }
